services:
  postgres:
    image: postgres:17-alpine
    container_name: aula-jwt-postgres
    environment:
      POSTGRES_DB: aula_jwt
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula -d aula_jwt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
